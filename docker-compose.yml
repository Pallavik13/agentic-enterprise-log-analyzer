services:
  mysql:
    image: mysql:8.4
    container_name: log-analyzer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: log_analyzer
      MYSQL_USER: analyzer
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: log-analyzer-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/log_analyzer?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: analyzer
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
