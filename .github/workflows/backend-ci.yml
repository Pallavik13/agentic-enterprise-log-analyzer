name: Application CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    name: Build and test Spring Boot backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B -f backend/pom.xml verify
      - run: docker compose config -q
      - run: docker build -f backend/Dockerfile -t log-analyzer-backend:ci .

  frontend:
    name: Build React dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --prefix frontend
      - run: npm run build --prefix frontend
